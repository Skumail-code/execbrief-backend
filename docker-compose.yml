version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=execbrief
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - MAX_UPLOAD_MB=10
      - APP_ENV=production
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
